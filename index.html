<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Havas - Туры по Узбекистану</title>

  <!-- meta / og / seo (по желанию) -->
  <meta name="description" content="Havas - туристическая компания в Самарканде. Организуем туры по Узбекистану, экскурсии, трансферы." />

  <!-- Google Translate init -->
  <script>
    function googleTranslateElementInit() {
      new google.translate.TranslateElement({
        pageLanguage: 'ru',
        includedLanguages: 'ru,uz,en,de',
        autoDisplay: false
      }, 'google_translate_element');
      // пометка — переводчик инициализирован
      window.__gt_loaded = true;
    }

    // waitForComboAndApply: ждём появление .goog-te-combo и применяем язык (если указан)
    function waitForComboAndApply(lang) {
      const maxTries = 30;
      let tries = 0;
      const id = setInterval(() => {
        tries++;
        const select = document.querySelector('.goog-te-combo');
        if (select) {
          if (lang) {
            try {
              select.value = lang;
              select.dispatchEvent(new Event('change'));
            } catch (e) {
              // fallback: смена selectedIndex
              for (let i = 0; i < select.options.length; i++) {
                if (select.options[i].value === lang) {
                  select.selectedIndex = i;
                  select.dispatchEvent(new Event('change'));
                  break;
                }
              }
            }
          }
          clearInterval(id);
        }
        if (tries >= maxTries) clearInterval(id);
      }, 300);
    }

    // Глобальная функция для вызова из React
    window.changeLanguage = function(lang) {
      try { localStorage.setItem('site_lang', lang); } catch(e){}
      waitForComboAndApply(lang);
    };

    // При загрузке документа — если в localStorage есть язык, применяем
    document.addEventListener('DOMContentLoaded', function() {
      try {
        const saved = localStorage.getItem('site_lang');
        if (saved) {
          // если translate уже загрузился — применим, иначе подождём
          waitForComboAndApply(saved);
        }
      } catch (e) {}
    });
  </script>

  <!-- подключаем скрипт Google Translate (асинхронно) -->
  <script src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit" defer></script>

  <style>
    /* Мы НЕ удаляем #google_translate_element из DOM, но прячем за экран */
    #google_translate_element { position: absolute; left: -9999px; top: -9999px; visibility: hidden; }
    /* Скрываем баннер/виджеты, если появятся */
    .goog-te-banner-frame, .goog-te-gadget, .goog-te-gadget-simple, .skiptranslate { display: none !important; }
  </style>
</head>
<body>
  <!-- важный контейнер (в DOM) -->
  <div id="google_translate_element"></div>

  <!-- React root -->
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
